<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ফেরত — PUSTI ERP</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <div id="app">
    <p class="note">
      <strong>ফেরত = রিটার্ন।</strong> SR যে মাল নিয়ে গিয়েছিল তার কিছু গুদামে ফিরলে এখানে লিখবেন।
      ফলে: স্টক বাড়ে · ডেলিভারি (নেট) কমে · লোড শিটের সাথে মিলিয়ে রাখা যায়।
    </p>
    <div class="panel">
      <div class="inline-form">
        <div class="field" style="margin:0">
          <label>তারিখ</label>
          <input type="date" value="2026-03-15" />
        </div>
        <div class="field" style="margin:0">
          <label>সম্পর্কিত লোড শিট</label>
          <select><option>LD-2026-03-15 · মনির · রুট-ক</option></select>
        </div>
        <div class="field" style="margin:0">
          <label>কারণ</label>
          <select><option>অবিক্রীত</option><option>ক্ষতিগ্রস্ত</option><option>ভুল পণ্য</option></select>
        </div>
      </div>
      <table class="data" id="tbl"></table>
      <div class="toolbar" style="margin-top:16px">
        <button class="btn btn-primary" data-toast="ফেরত সংরক্ষণ (ডেমো)">সংরক্ষণ</button>
      </div>
    </div>
  </div>
  <script src="../assets/sample-data.js"></script>
  <script src="../assets/app.js"></script>
  <script>
    mountApp({
      page: "return-firot",
      title: "ফেরত (Return)",
      onReady() {
        const returns = SAMPLE.samariLines.filter(l => l.retC || l.retP);
        document.getElementById("tbl").innerHTML = `
          <thead><tr>
            <th>পণ্য</th><th class="num">ফেরত কার্টন</th><th class="num">ফেরত ইউনিট</th><th class="num">মোট</th>
          </tr></thead>
          <tbody>${returns.map(l => {
            const p = productById(l.id);
            const t = pcsTotal(l.retC, l.retP, p.carton);
            return `<tr>
              <td>${p.name}</td>
              <td class="num"><input class="cell" type="number" value="${l.retC}" /></td>
              <td class="num"><input class="cell" type="number" value="${l.retP}" /></td>
              <td class="num">${fmt(t)}</td>
            </tr>`;
          }).join("") || `<tr><td colspan="4" class="muted">আজ কোনো ফেরত নেই</td></tr>`}</tbody>`;
      }
    });
  </script>
</body>
</html>
