<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>রুট ও যানবাহন — PUSTI ERP</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <div id="app">
    <div class="toolbar">
      <span class="spacer"></span>
      <button class="btn btn-primary" data-toast="রুট যোগ (ডেমো)">+ রুট</button>
    </div>
    <div class="grid grid-3" id="list"></div>
  </div>
  <script src="../assets/sample-data.js"></script>
  <script src="../assets/app.js"></script>
  <script>
    mountApp({
      page: "routes-vans",
      title: "রুট ও যানবাহন",
      onReady() {
        document.getElementById("list").innerHTML = SAMPLE.routes.map(r => `
          <div class="panel">
            <div class="panel-head"><h2>${r.name}</h2><span class="tag">${r.sr}</span></div>
            <p style="margin:0 0 6px"><strong>এলাকা:</strong> ${r.area}</p>
            <p style="margin:0" class="muted"><strong>ভ্যান:</strong> ${r.van}</p>
          </div>`).join("");
      }
    });
  </script>
</body>
</html>
