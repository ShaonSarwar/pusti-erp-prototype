<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>মাল আসা — PUSTI ERP</title>
  <link rel="stylesheet" href="../assets/styles.css" />
</head>
<body>
  <div id="app">
    <p class="note">
      <strong>শীটে Receive খুব কম দিনে ভরা</strong> — আলাদা ভারী “ক্রয় গ্রহণ ভৌচার” অতিরিক্ত।
      এখানে শুধু <em>ঐচ্ছিক</em> মাল ঢোকানো: qty + ক্রয় rate → স্টক।
      Due-এর সাথে মিলিয়ে করতে চাইলে <a href="goods-due.html">পণ্য Due / Balance</a> ব্যবহার করুন।
      ব্যাচ নম্বর ঐচ্ছিক (শীটে সাধারণত এক purchase rate)।
    </p>
    <div class="panel">
      <div class="inline-form">
        <div class="field" style="margin:0">
          <label>তারিখ</label>
          <input type="date" id="recv-date" value="2026-01-05" />
        </div>
        <div class="field" style="margin:0">
          <label>নোট / চালান</label>
          <input type="text" id="challan" value="RECV-05" />
        </div>
      </div>
      <div class="scroll-x">
        <table class="data">
          <thead>
            <tr>
              <th>পণ্য</th>
              <th class="num">কার্টন</th>
              <th class="num">পিস</th>
              <th class="num">মোট পিস</th>
              <th class="num">ক্রয় rate</th>
              <th class="num">টাকা</th>
              <th>ব্যাচ (ঐচ্ছিক)</th>
            </tr>
          </thead>
          <tbody id="body"></tbody>
        </table>
      </div>
      <div class="toolbar" style="margin-top:16px">
        <button type="button" class="btn btn-ghost" id="btn-add">+ লাইন</button>
        <button type="button" class="btn btn-primary" id="btn-ok">স্টকে যোগ (ডেমো)</button>
        <span class="spacer"></span>
        <strong id="total"></strong>
      </div>
    </div>
  </div>
  <script src="../assets/sample-data.js"></script>
  <script src="../assets/app.js"></script>
  <script>
    let lines = [
      { productId: 1, c: 30, p: 0, rate: 93.979, batchNo: "" },
      { productId: 2, c: 50, p: 0, rate: 186.468, batchNo: "" }
    ];

    function options(sel) {
      return SAMPLE.products.map((p) =>
        `<option value="${p.id}" ${p.id === sel ? "selected" : ""}>${p.name}</option>`
      ).join("");
    }

    function recompute() {
      let sum = 0;
      document.querySelectorAll("#body tr").forEach((tr, i) => {
        const pid = +tr.querySelector(".pid").value;
        const p = productById(pid);
        const c = +tr.querySelector(".c").value || 0;
        const pi = +tr.querySelector(".p").value || 0;
        const rate = +tr.querySelector(".rate").value || 0;
        const tot = pcsTotal(c, pi, p.carton);
        tr.querySelector(".tot").textContent = fmt(tot);
        tr.querySelector(".amt").textContent = fmt(tot * rate);
        sum += tot * rate;
        lines[i] = {
          productId: pid,
          c, p: pi, rate,
          batchNo: tr.querySelector(".batch").value.trim()
        };
      });
      document.getElementById("total").textContent = "মোট: ৳" + fmt(sum);
    }

    function render() {
      document.getElementById("body").innerHTML = lines.map((row, idx) => `
        <tr data-i="${idx}">
          <td><select class="select pid">${options(row.productId)}</select></td>
          <td class="num"><input class="cell c" type="number" value="${row.c}" /></td>
          <td class="num"><input class="cell p" type="number" value="${row.p}" /></td>
          <td class="num tot">0</td>
          <td class="num"><input class="cell rate" type="number" step="0.01" value="${row.rate}" /></td>
          <td class="num amt">0</td>
          <td><input class="input batch" placeholder="খালি রাখুন" value="${row.batchNo || ""}" /></td>
        </tr>`).join("");
      document.querySelectorAll("#body input, #body select").forEach((el) => {
        el.addEventListener("input", recompute);
        el.addEventListener("change", recompute);
      });
      recompute();
    }

    mountApp({
      page: "purchase-receive",
      title: "মাল আসা (Receive — ঐচ্ছিক)",
      onReady() {
        render();
        document.getElementById("btn-add").onclick = () => {
          const p = SAMPLE.products[0];
          lines.push({ productId: p.id, c: 0, p: 0, rate: p.buy, batchNo: "" });
          render();
        };
        document.getElementById("btn-ok").onclick = () => {
          recompute();
          const date = document.getElementById("recv-date").value;
          lines.forEach((row, i) => {
            const pr = productById(row.productId);
            const qty = pcsTotal(row.c, row.p, pr.carton);
            if (qty <= 0) return;
            SAMPLE.batches.push({
              id: "rx" + Date.now() + i,
              productId: row.productId,
              batchNo: row.batchNo || ("RECV-" + date),
              receiveDate: date,
              qty,
              rate: row.rate,
              supplier: "Receive"
            });
          });
          toast("স্টকে যোগ হয়েছে (সেশন) — goods-due দিয়ে Due balance মিলান");
        };
      }
    });
  </script>
</body>
</html>
